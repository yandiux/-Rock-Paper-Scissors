<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Rock Paper Scissors</title>
  </head>
  <body>
    <h1 class="title">Rock Paper Scissors</h1>

    <div class="container">
      <img src="./img/icons8-roca-80.png" alt="rock" />
      <img src="./img/icons8-papel-48.png" alt="paper" />
      <img src="./img/icons8-tijeras-48.png" alt="Scissors" />
    </div>

    <div class="buttons">
      <button id="rock">Rock</button>
      <button id="paper">Paper</button>
      <button id="scissors">Scissors</button>
    </div>

    <!-- Elementos para mostrar el resultado -->
    <p id="result">¡Elige para empezar a jugar!</p>
    <div class="results">
      <p id="human-score">Human Score: 0</p>
      <p id="computer-score">Computer Score: 0</p>
      <p id="message"></p>
    </div>

    <!-- New element for result message -->
    <script src="./script.js"></script>
  </body>
</html>
